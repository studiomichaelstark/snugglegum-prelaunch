# Cloudflare Worker with static assets: the static site in dist/ plus the sign-up API (worker/index.js,
# which uses functions/api/*.js). `name` must match the project name in Cloudflare.
#
# The secret MAILERLITE_API_KEY is NOT set here. It lives in Cloudflare (Settings -> Variables and Secrets).
name = "snugglegum-prelaunch"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Only /api/* runs the Worker, everything else is served straight from dist/ (including _headers and _redirects).
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[[kv_namespaces]]
binding = "SIGNUPS"
id = "48407f21ac0d4b3182cc9b7fed058c47"
